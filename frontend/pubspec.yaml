name: cbf_stats
description: "CBF Stats - Brasileirão 2025 Analytics Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP and API
  http: ^1.1.0
  
  # State management
  provider: ^6.0.0
  
  # Data visualization
  fl_chart: ^0.64.0
  
  # Date/time utilities
  intl: ^0.19.0
  
  # Image handling
  cached_network_image: ^3.3.0
  
  # Local storage
  shared_preferences: ^2.2.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Utilities
  equatable: ^2.0.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/clubs/
